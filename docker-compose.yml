# KisanSaarthi AI - run with:  docker compose up --build
# Secrets come from .env (copy .env.example). Never commit .env.
#
# Default database is SQLite in ./db (copy your kisansaarthi.db there first).
# Optional PostgreSQL:  docker compose --profile postgres up --build
# and set DATABASE_URL in .env to the postgresql+psycopg2 URL in DEPLOYMENT.md.

services:
  app:
    build:
      context: .
      args:
        WITH_VISION: "true"
    image: kisansaarthi-ai:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/db/kisansaarthi.db}
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: kisan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: kisansaarthi
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
