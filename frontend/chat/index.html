<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KisanSaarthi AI</title>
<style>
:root {
  --page: #eef2f5;
  --panel: #ffffff;
  --soft: #f6f8fa;
  --ink: #17212b;
  --muted: #5f6f7d;
  --line: #dbe3e9;
  --brand: #0f766e;
  --brand-dark: #0b5a54;
  --brand-tint: #e3f3f1;
  --user: #0f766e;
  --user-text: #ffffff;
  --answer: #15803d;
  --ask: #b45309;
  --abstain: #b91c1c;
  --shadow: 0 10px 30px rgba(20, 40, 60, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0c1217;
    --panel: #141c23;
    --soft: #1a242d;
    --ink: #e8eef2;
    --muted: #93a4b1;
    --line: #26333d;
    --brand: #2dd4bf;
    --brand-dark: #14b8a6;
    --brand-tint: #123a37;
    --user: #0f766e;
    --user-text: #ffffff;
    --answer: #4ade80;
    --ask: #fbbf24;
    --abstain: #f87171;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Telugu", sans-serif;
  display: flex;
  justify-content: center;
  align-items: stretch;
}
.app {
  width: 100%;
  max-width: 860px;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  box-shadow: var(--shadow);
}
@media (min-width: 900px) {
  body { padding: 18px 0; }
  .app { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
}

/* ---------- header ---------- */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.mark {
  width: 40px; height: 40px; flex: none;
  border-radius: 12px;
  background: var(--brand);
  display: grid; place-items: center;
}
.mark svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
header .title { flex: 1; min-width: 0; }
header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; letter-spacing: .01em; }
header small { color: var(--muted); display: block; font-size: .8rem; }
.pillbtn, header select {
  background: var(--soft);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  font: inherit;
  font-size: .85rem;
  cursor: pointer;
}
.pillbtn:hover, header select:hover { border-color: var(--brand); }

/* ---------- context strip ---------- */
#context {
  display: none;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--soft);
}
#context.on { display: flex; }
#context .label { font-size: .75rem; color: var(--muted); margin-right: 4px; text-transform: uppercase; letter-spacing: .06em; }
.chip {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: .8rem;
}
.chip b { font-weight: 600; color: var(--brand); margin-right: 5px; }

/* ---------- conversation ---------- */
#log {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px;
  background: var(--soft);
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}
.row { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
.row.farmer { justify-content: flex-end; }
.avatar {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: var(--brand-tint);
  display: grid; place-items: center;
  margin-top: 2px;
}
.avatar svg { width: 17px; height: 17px; fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.msg {
  max-width: min(82%, 620px);
  padding: 10px 14px;
  border-radius: 16px;
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}
.msg.bot { background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg.farmer { background: var(--user); color: var(--user-text); border-top-right-radius: 4px; }
.msg.advisory { border-left: 4px solid var(--answer); }
.msg.question { border-left: 4px solid var(--ask); }
.msg.abstain { border-left: 4px solid var(--abstain); }
.msg.note, .msg.weather, .msg.info { font-size: .92rem; color: var(--muted); background: var(--panel); }
.msg.error { border-left: 4px solid var(--abstain); color: var(--abstain); }
.msg img { display: block; max-width: 100%; max-height: 240px; border-radius: 10px; margin-bottom: 6px; }
.stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; max-width: 100%; }
.badge {
  font-size: .72rem;
  letter-spacing: .06em;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid currentColor;
  background: var(--panel);
}
.badge.ANSWER { color: var(--answer); }
.badge.ASK_FOLLOW_UP { color: var(--ask); }
.badge.ABSTAIN { color: var(--abstain); }
details.more { max-width: 100%; font-size: .85rem; color: var(--muted); }
details.more summary { cursor: pointer; padding: 2px 0; }
details.more pre {
  white-space: pre-wrap;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  margin: 4px 0 0;
  font: .8rem/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
  color: var(--ink);
}

/* ---------- loading ring ---------- */
.ring {
  width: 18px; height: 18px; flex: none;
  border: 3px solid var(--line);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  display: inline-block;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.typing { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; padding: 4px 2px 4px 40px; }

/* ---------- sample prompts ---------- */
.quick { margin: 4px 0 2px 40px; }
.quick h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.quick .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.quick button {
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  font: inherit;
  font-size: .9rem;
  color: var(--ink);
  cursor: pointer;
}
.quick button:hover { border-color: var(--brand); background: var(--brand-tint); }
.quick button small { display: block; color: var(--muted); font-size: .75rem; margin-top: 2px; }

/* ---------- composer ---------- */
#attach {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-top: 1px solid var(--line);
  background: var(--panel);
}
#attach.on { display: flex; }
#attach img { height: 52px; width: 52px; object-fit: cover; border-radius: 10px; }
#attach .name { flex: 1; min-width: 0; font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.link { background: none; border: none; color: var(--brand); cursor: pointer; font: inherit; font-size: .88rem; padding: 0; text-decoration: underline; }
.composer {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--panel);
}
.composer textarea {
  flex: 1;
  resize: none;
  max-height: 120px;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 14px;
  font: inherit;
  background: var(--soft);
  color: var(--ink);
}
.composer textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
.icon {
  width: 44px; height: 44px; flex: none;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--brand);
  display: grid; place-items: center;
  cursor: pointer; padding: 0;
}
.icon:hover { border-color: var(--brand); background: var(--brand-tint); }
.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon:disabled { opacity: .5; cursor: default; }
.send { background: var(--brand); color: #fff; border-color: var(--brand); }
.send:hover { background: var(--brand-dark); }
.send .ring { border-color: rgba(255,255,255,.4); border-top-color: #fff; display: none; }
.send.busy svg { display: none; }
.send.busy .ring { display: inline-block; }
#hint { display: none; padding: 6px 16px; font-size: .82rem; color: var(--ask); background: var(--panel); border-top: 1px solid var(--line); }
#hint.on { display: block; }

/* ---------- dialogs ---------- */
dialog {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  background: var(--panel);
  color: var(--ink);
  width: min(94vw, 460px);
}
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h3 { margin: 0 0 4px; font-size: 1.1rem; }
dialog p.sub { margin: 0 0 14px; color: var(--muted); font-size: .88rem; }
dialog video { width: 100%; border-radius: 10px; background: #000; max-height: 60vh; }
dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
dialog button.btn {
  border-radius: 10px;
  border: 1px solid var(--line);
  padding: 9px 16px;
  font: inherit;
  cursor: pointer;
  background: var(--panel);
  color: var(--ink);
}
dialog button.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
dialog button.btn.wide { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--brand-tint); border-color: var(--brand); color: var(--brand-dark); font-weight: 600; }
@media (prefers-color-scheme: dark) { dialog button.btn.wide { color: var(--brand); } }
.or { text-align: center; color: var(--muted); font-size: .78rem; margin: 12px 0 8px; text-transform: uppercase; letter-spacing: .08em; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields label { font-size: .78rem; color: var(--muted); display: block; margin-bottom: 3px; }
.fields input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  font: inherit;
  background: var(--soft);
  color: var(--ink);
}
.samples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.samples button { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: .82rem; color: var(--ink); cursor: pointer; }
.samples button:hover { border-color: var(--brand); }
#locStatus { min-height: 22px; margin-top: 12px; font-size: .86rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
#locStatus.ok { color: var(--answer); }
#locStatus.bad { color: var(--abstain); }
.note-small { font-size: .78rem; color: var(--muted); margin-top: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 21V11"/><path d="M12 11C12 7 9 4.500 4.500 4.500 4.500 9 7 11 12 11z"/><path d="M12 14c0-3.500 2.500-6 7.500-6 0 4.500-3 6-7.500 6z"/></svg>
    </div>
    <div class="title">
      <h1>KisanSaarthi AI</h1>
      <small>Crop advisory for your field</small>
    </div>
    <label class="sr" for="lang">Language</label>
    <select id="lang" title="Language">
      <option value="auto">Auto</option>
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="ta">தமிழ்</option>
      <option value="te">తెలుగు</option>
    </select>
    <button class="pillbtn" id="reset" type="button" title="Start a new conversation">New chat</button>
  </header>

  <div id="context" aria-label="What I know so far"></div>
  <div id="log" role="log" aria-live="polite"></div>
  <div id="hint"></div>

  <div id="attach">
    <img id="attachImg" alt="Selected crop photo">
    <div class="name" id="attachName"></div>
    <button class="link" id="replaceImg" type="button">Replace</button>
    <button class="link" id="removeImg" type="button">Remove</button>
  </div>

  <form class="composer" id="form" autocomplete="off">
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" class="sr" tabindex="-1">
    <button class="icon" type="button" id="btnUpload" title="Upload photo" aria-label="Upload photo">
      <svg viewBox="0 0 24 24"><path d="M21 12.500l-8.600 8.600a5 5 0 0 1-7.100-7.100l9-9a3.300 3.300 0 0 1 4.700 4.700l-9 9a1.700 1.700 0 0 1-2.400-2.400l8.300-8.300"/></svg>
    </button>
    <button class="icon" type="button" id="btnCamera" title="Take photo" aria-label="Take photo">
      <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.500-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.500"/></svg>
    </button>
    <button class="icon" type="button" id="btnLocation" title="Share location" aria-label="Share location">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.200-7-11.500a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
    </button>
    <label class="sr" for="text">Message</label>
    <textarea id="text" rows="1" placeholder="Describe the crop problem..." maxlength="2000"></textarea>
    <button class="icon send" type="submit" id="btnSend" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
      <span class="ring"></span>
    </button>
  </form>
</div>

<dialog id="camDialog">
  <video id="camVideo" playsinline muted></video>
  <div class="actions">
    <button class="btn" type="button" id="camCancel">Cancel</button>
    <button class="btn primary" type="button" id="camShot">Capture</button>
  </div>
</dialog>

<dialog id="locDialog">
  <h3>Share field location</h3>
  <p class="sub">Used for local weather and soil. Nothing is stored outside this session.</p>
  <button class="btn wide" type="button" id="btnGps">Use my current location</button>
  <div class="or">or enter manually</div>
  <div class="fields">
    <div><label for="latIn">Latitude</label><input id="latIn" type="number" step="any" min="-90" max="90" placeholder="11.3410"></div>
    <div><label for="lonIn">Longitude</label><input id="lonIn" type="number" step="any" min="-180" max="180" placeholder="77.7172"></div>
  </div>
  <div class="samples" id="samples">
    <button type="button" data-lat="13.0827" data-lon="80.2707">Chennai</button>
    <button type="button" data-lat="11.3410" data-lon="77.7172">Erode</button>
    <button type="button" data-lat="11.0168" data-lon="76.9558">Coimbatore</button>
    <button type="button" data-lat="9.9252" data-lon="78.1198">Madurai</button>
    <button type="button" data-lat="16.3067" data-lon="80.4365">Guntur</button>
  </div>
  <div id="locStatus"></div>
  <div class="note-small">The place name is looked up online. If it is not found, type the district and state in the chat, for example: Erode, Tamil Nadu.</div>
  <div class="actions">
    <button class="btn" type="button" id="locCancel">Cancel</button>
    <button class="btn primary" type="button" id="locShare">Share location</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), form = $("form"), textEl = $("text"), langEl = $("lang");
  var state = { session: null, image: null, busy: false, coords: null };

  var UI = {
    en: { wait: "Thinking...", noLoc: "Location is not available in this browser. Enter it manually.", camFail: "Could not open the camera. Use Upload instead.", details: "English details", trace: "How this was decided", photoOnly: "Photo", err: "Something went wrong" },
    hi: { wait: "सोच रहा हूँ...", noLoc: "इस ब्राउज़र में लोकेशन उपलब्ध नहीं है।", camFail: "कैमरा नहीं खुल सका। अपलोड का उपयोग करें।", details: "English details", trace: "निर्णय कैसे लिया गया", photoOnly: "फोटो", err: "कुछ गड़बड़ हुई" },
    ta: { wait: "யோசிக்கிறேன்...", noLoc: "இந்த உலாவியில் இருப்பிடம் கிடைக்கவில்லை.", camFail: "கேமராவை திறக்க முடியவில்லை. பதிவேற்றத்தைப் பயன்படுத்துங்கள்.", details: "English details", trace: "எப்படி முடிவு செய்யப்பட்டது", photoOnly: "புகைப்படம்", err: "ஏதோ தவறு நடந்தது" },
    te: { wait: "ఆలోచిస్తున్నాను...", noLoc: "ఈ బ్రౌజర్‌లో లొకేషన్ అందుబాటులో లేదు.", camFail: "కెమెరా తెరవలేకపోయాను. అప్‌లోడ్ ఉపయోగించండి.", details: "English details", trace: "నిర్ణయం ఎలా తీసుకున్నారు", photoOnly: "ఫోటో", err: "ఏదో తప్పు జరిగింది" }
  };
  var currentLang = "en";
  function ui(key) { return (UI[currentLang] || UI.en)[key] || UI.en[key]; }

  var SAMPLES = [
    { title: "Tomato fruit borer", hint: "Asks the follow-up questions one by one", text: "My tomato has fruit borer" },
    { title: "Full details in one message", hint: "Rice blast, 1 acre, Erode", text: "Rice blast, 1 acre, Erode, Tamil Nadu, harvest in 40 days, vegetative stage, no previous spray" },
    { title: "Harvest too close", hint: "Safety check should block the spray", text: "Rice blast, 1 acre, Erode, Tamil Nadu, harvest in 5 days, vegetative stage, no previous spray" },
    { title: "Hindi", hint: "Reply comes back in Hindi", text: "मेरी मिर्च की पत्तियाँ मुड़ रही हैं।" }
  ];

  var BOT_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21V11"/><path d="M12 11C12 7 9 4.500 4.500 4.500 4.500 9 7 11 12 11z"/><path d="M12 14c0-3.500 2.500-6 7.500-6 0 4.500-3 6-7.500 6z"/></svg>';

  function safeStore(key, value) {
    try {
      if (value === undefined) { return sessionStorage.getItem(key); }
      if (value === null) { sessionStorage.removeItem(key); } else { sessionStorage.setItem(key, value); }
    } catch (e) { /* storage unavailable: session lives in memory only */ }
    return null;
  }

  // ---------------- rendering (text nodes only, no HTML injection) ----------------
  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function botRow() {
    var row = document.createElement("div");
    row.className = "row bot";
    var av = document.createElement("div");
    av.className = "avatar";
    av.appendChild(document.importNode(new DOMParser().parseFromString(BOT_ICON, "image/svg+xml").documentElement, true));  // constant icon, no user text
    var stack = document.createElement("div");
    stack.className = "stack";
    row.appendChild(av); row.appendChild(stack);
    log.appendChild(row);
    return stack;
  }

  function bubbleEl(role, text, kind, imageUrl) {
    var el = document.createElement("div");
    el.className = "msg " + role + (kind ? " " + kind : "");
    if (imageUrl) {
      var img = document.createElement("img");
      img.src = imageUrl;
      img.alt = ui("photoOnly");
      el.appendChild(img);
    }
    if (text) {
      var span = document.createElement("span");
      span.textContent = text;
      el.appendChild(span);
    }
    return el;
  }

  function addBubble(role, text, kind, imageUrl) {
    var el = bubbleEl(role, text, kind, imageUrl);
    if (role === "farmer") {
      var row = document.createElement("div");
      row.className = "row farmer";
      row.appendChild(el);
      log.appendChild(row);
    } else {
      botRow().appendChild(el);
    }
    scrollDown();
    return el;
  }

  function addBadge(decision, stack) {
    if (!decision) { return; }
    var b = document.createElement("div");
    b.className = "badge " + decision;
    b.textContent = decision.replace("_", " ");
    stack.appendChild(b);
  }

  function addDetails(summary, body, stack) {
    if (!body) { return; }
    var d = document.createElement("details");
    d.className = "more";
    var s = document.createElement("summary");
    s.textContent = summary;
    var pre = document.createElement("pre");
    pre.textContent = body;
    d.appendChild(s);
    d.appendChild(pre);
    stack.appendChild(d);
  }

  function traceText(trace) {
    return (trace || []).map(function (step) {
      var agent = step.agent;
      var parts = Object.keys(step).filter(function (k) { return k !== "agent" && step[k] !== null && step[k] !== undefined && step[k] !== ""; })
        .map(function (k) { var v = step[k]; return k + "=" + (typeof v === "object" ? JSON.stringify(v) : v); });
      return agent + (parts.length ? ": " + parts.join(", ") : "");
    }).join("\n");
  }

  function renderContext(ctx) {
    var box = $("context");
    box.textContent = "";
    var items = [];
    if (ctx) {
      items = [
        ["Crop", ctx.crop], ["Problem", ctx.pest ? ctx.pest : (ctx.symptoms && ctx.symptoms.length ? ctx.symptoms.join(", ") : null)],
        ["Place", ctx.location], ["Area", ctx.land_area ? ctx.land_area + " " + (ctx.land_unit || "") : null],
        ["Stage", ctx.growth_stage], ["Harvest in", ctx.days_to_harvest !== null && ctx.days_to_harvest !== undefined ? ctx.days_to_harvest + " days" : null],
        ["Last spray", ctx.previous_treatment ? ctx.previous_treatment + (ctx.days_since_previous_treatment !== null && ctx.days_since_previous_treatment !== undefined ? ", " + ctx.days_since_previous_treatment + " d ago" : "") : null]
      ];
    }
    if (state.coords) { items.push(["GPS", state.coords]); }
    items = items.filter(function (p) { return p[1]; });
    if (items.length) {
      var lab = document.createElement("span");
      lab.className = "label";
      lab.textContent = "So far";
      box.appendChild(lab);
    }
    items.forEach(function (p) {
      var c = document.createElement("span");
      c.className = "chip";
      var b = document.createElement("b");
      b.textContent = p[0];
      c.appendChild(b);
      c.appendChild(document.createTextNode(String(p[1])));
      box.appendChild(c);
    });
    box.classList.toggle("on", items.length > 0);
  }

  function renderReply(data) {
    if (data.language && UI[data.language]) { currentLang = data.language; }
    var stack = botRow();
    (data.messages || []).forEach(function (m) { stack.appendChild(bubbleEl("bot", m.text, m.kind)); });
    addBadge(data.decision, stack);
    if (data.details) { addDetails(data.details_label || ui("details"), data.details, stack); }
    if (data.agent_trace && data.agent_trace.length) { addDetails(ui("trace"), traceText(data.agent_trace), stack); }
    renderContext(data.context);
    scrollDown();
  }

  // ---------------- sample prompts ----------------
  function removeQuick() { var q = log.querySelector(".quick"); if (q) { q.remove(); } }
  function showQuick() {
    removeQuick();
    var wrap = document.createElement("div");
    wrap.className = "quick";
    var h = document.createElement("h2");
    h.textContent = "Try a sample";
    var grid = document.createElement("div");
    grid.className = "grid";
    SAMPLES.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = s.title;
      var sm = document.createElement("small");
      sm.textContent = s.hint;
      b.appendChild(sm);
      b.addEventListener("click", function () { submitText(s.text); });
      grid.appendChild(b);
    });
    wrap.appendChild(h); wrap.appendChild(grid);
    log.appendChild(wrap);
    scrollDown();
  }

  // ---------------- network ----------------
  function setBusy(on) {
    state.busy = on;
    $("btnSend").disabled = on;
    $("btnSend").classList.toggle("busy", on);
    var old = $("typing");
    if (old) { old.remove(); }
    if (on) {
      var t = document.createElement("div");
      t.id = "typing"; t.className = "typing";
      var ring = document.createElement("span"); ring.className = "ring";
      var label = document.createElement("span"); label.textContent = ui("wait");
      t.appendChild(ring); t.appendChild(label);
      log.appendChild(t); scrollDown();
    }
  }

  async function sendTurn(opts) {
    if (state.busy) { return; }
    var fd = new FormData();
    if (state.session) { fd.append("session_id", state.session); }
    fd.append("language", langEl.value);
    if (opts.text) { fd.append("text", opts.text); }
    if (opts.image) { fd.append("image", opts.image, opts.image.name || "photo.jpg"); }
    if (opts.lat !== undefined) { fd.append("latitude", String(opts.lat)); fd.append("longitude", String(opts.lon)); }
    setBusy(true);
    try {
      var res = await fetch("/api/chat/turn", { method: "POST", body: fd });
      var data = await res.json().catch(function () { return {}; });
      setBusy(false);
      if (!res.ok) {
        addBubble("bot", (typeof data.detail === "string" ? data.detail : ui("err")), "error");
        return;
      }
      state.session = data.session_id;
      safeStore("ks_session", state.session);
      renderReply(data);
    } catch (e) {
      setBusy(false);
      addBubble("bot", ui("err"), "error");
    }
  }

  // ---------------- composer ----------------
  function clearHint() { $("hint").classList.remove("on"); $("hint").textContent = ""; }

  function setImage(file) {
    if (state.image && state.image.url) { URL.revokeObjectURL(state.image.url); }
    if (!file) { state.image = null; $("attach").classList.remove("on"); return; }
    state.image = { file: file, url: URL.createObjectURL(file) };
    $("attachImg").src = state.image.url;
    $("attachName").textContent = file.name || "photo.jpg";
    $("attach").classList.add("on");
  }

  function autosize() { textEl.style.height = "auto"; textEl.style.height = Math.min(textEl.scrollHeight, 120) + "px"; }
  textEl.addEventListener("input", autosize);
  textEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  function submitText(text) {
    if (state.busy) { return; }
    removeQuick();
    addBubble("farmer", text);
    sendTurn({ text: text });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = textEl.value.trim();
    var image = state.image ? state.image.file : null;
    if (!text && !image) { return; }
    if (state.busy) { return; }
    removeQuick();
    addBubble("farmer", text, null, state.image ? state.image.url : null);
    textEl.value = ""; autosize(); clearHint();
    state.image = null; $("attach").classList.remove("on");
    sendTurn({ text: text, image: image });
  });

  $("btnUpload").addEventListener("click", function () { $("file").click(); });
  $("replaceImg").addEventListener("click", function () { $("file").click(); });
  $("removeImg").addEventListener("click", function () { setImage(null); });
  $("file").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (f) { setImage(f); }
    this.value = "";
  });

  // ---------------- camera ----------------
  var camStream = null;
  function stopCam() {
    if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
    if ($("camDialog").open) { $("camDialog").close(); }
  }
  $("btnCamera").addEventListener("click", async function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { addBubble("bot", ui("camFail"), "error"); return; }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
      $("camVideo").srcObject = camStream;
      $("camDialog").showModal();
      await $("camVideo").play();
    } catch (e) { stopCam(); addBubble("bot", ui("camFail"), "error"); }
  });
  $("camCancel").addEventListener("click", stopCam);
  $("camDialog").addEventListener("cancel", stopCam);
  $("camShot").addEventListener("click", function () {
    var v = $("camVideo");
    if (!v.videoWidth) { return; }
    var c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    c.toBlob(function (blob) {
      if (blob) { setImage(new File([blob], "camera_" + Date.now() + ".jpg", { type: "image/jpeg" })); }
      stopCam();
    }, "image/jpeg", 0.9);
  });

  // ---------------- location: live GPS or manual entry ----------------
  var locStatus = $("locStatus");
  function setLocStatus(kind, text, spinning) {
    locStatus.className = kind || "";
    locStatus.textContent = "";
    if (spinning) { var r = document.createElement("span"); r.className = "ring"; locStatus.appendChild(r); }
    locStatus.appendChild(document.createTextNode(text || ""));
  }

  $("btnLocation").addEventListener("click", function () {
    setLocStatus("", "");
    $("locDialog").showModal();
  });
  $("locCancel").addEventListener("click", function () { $("locDialog").close(); });

  $("samples").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    $("latIn").value = b.getAttribute("data-lat");
    $("lonIn").value = b.getAttribute("data-lon");
    setLocStatus("ok", b.textContent + " selected. Press Share location.");
  });

  $("btnGps").addEventListener("click", function () {
    if (!navigator.geolocation) { setLocStatus("bad", ui("noLoc")); return; }
    setLocStatus("", "Finding your location...", true);
    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      $("latIn").value = lat.toFixed(5);
      $("lonIn").value = lon.toFixed(5);
      setLocStatus("ok", "Found " + lat.toFixed(5) + ", " + lon.toFixed(5) + " (accuracy about " + Math.round(pos.coords.accuracy) + " m). Press Share location.");
    }, function (err) {
      var why = err && err.code === 1 ? "Permission was denied in the browser." : err && err.code === 3 ? "It took too long." : "No position was available.";
      setLocStatus("bad", why + " Pick a sample or type the coordinates.");
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });

  $("locShare").addEventListener("click", function () {
    var lat = parseFloat($("latIn").value), lon = parseFloat($("lonIn").value);
    if (!isFinite(lat) || !isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      setLocStatus("bad", "Enter a latitude between -90 and 90 and a longitude between -180 and 180.");
      return;
    }
    if (state.busy) { return; }
    $("locDialog").close();
    removeQuick();
    state.coords = lat.toFixed(4) + ", " + lon.toFixed(4);
    addBubble("farmer", "Location shared: " + state.coords);
    renderContext(null);
    sendTurn({ lat: lat, lon: lon });
  });

  // ---------------- header ----------------
  async function greet(showSamples) {
    try {
      var lang = langEl.value === "auto" ? "en" : langEl.value;
      currentLang = lang;
      var res = await fetch("/api/chat/greeting?language=" + encodeURIComponent(lang));
      var data = await res.json();
      addBubble("bot", data.text);
    } catch (e) { addBubble("bot", "Hello. Which crop has a problem?"); }
    if (showSamples !== false) { showQuick(); }
  }

  function newChat() {
    if (state.session) { fetch("/api/chat/session/" + encodeURIComponent(state.session), { method: "DELETE" }).catch(function () {}); }
    state.session = null; state.coords = null; safeStore("ks_session", null);
    log.textContent = ""; renderContext(null); setImage(null); clearHint();
    greet();
  }
  $("reset").addEventListener("click", newChat);
  langEl.addEventListener("change", function () {
    if (langEl.value !== "auto") { currentLang = langEl.value; }
    if (!state.session && !log.querySelector(".row.farmer")) { log.textContent = ""; greet(); }
  });

  async function restore() {
    var sid = safeStore("ks_session");
    if (sid) {
      try {
        var res = await fetch("/api/chat/session/" + encodeURIComponent(sid));
        if (res.ok) {
          var data = await res.json();
          if (data.history && data.history.length) {
            state.session = data.session_id;
            data.history.forEach(function (h) {
              if (h.role === "user" && h.text === "[image]") { addBubble("farmer", ui("photoOnly")); }
              else { addBubble(h.role === "user" ? "farmer" : "bot", h.text, h.kind || null); }
            });
            renderContext(data.context);
            return;
          }
        }
      } catch (e) { /* fall through to greeting */ }
    }
    greet();
  }
  restore();
})();
</script>
</body>
</html>
