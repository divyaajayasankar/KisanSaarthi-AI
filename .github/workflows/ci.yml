# KisanSaarthi AI continuous integration.
# Every push to final-submission or main, and every pull request:
#   1. test:   install requirements and run the full pytest suite
#   2. docker: validate the compose file, build the image without PyTorch,
#              start the container and check GET /health
name: CI

on:
  push:
    branches: [final-submission, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build image (no PyTorch)
        run: docker build --build-arg WITH_VISION=false -t kisansaarthi-ai .
      - name: Start container and check health
        run: |
          docker run -d --name kisan -p 8000:8000 kisansaarthi-ai
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs kisan
          exit 1
